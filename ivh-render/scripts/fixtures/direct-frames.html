<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body { margin:0; background:transparent; }
.comp { position:absolute; width:200px; height:200px; background:#e34465; }
</style></head><body><div id="track">
<div class="comp" data-in="0.5" data-out="1.5"></div>
<div class="comp" data-in="2.5" data-out="3.5"></div>
</div><script>
const CONFIG = { PURPOSE:'overlay', BASE:'timeline', BG:'transparent', RATIO:'3:4', STYLE:'test', ANIMATE:true, HIDE_HUD:true };
window.IVH = { seekAt(t) {
  document.querySelectorAll('.comp').forEach(el => {
    el.style.visibility = t >= Number(el.dataset.in) && t < Number(el.dataset.out) ? 'visible' : 'hidden';
    el.style.transform = `translate(${Math.round(t * 30)}px, 40px)`;
  });
} };
IVH.seekAt(0);
</script></body></html>
